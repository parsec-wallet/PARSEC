<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Parsec">
  <title>Parsec</title>
  <!-- Flat vector reduction of the PARSEC emblem: a hollow delta arrowhead
       inside an orbital ring. Four elements only, so it stays legible at 16px.
       Colours are literal hexes (from abstracts/_brand.scss) so the file
       renders identically as a favicon, in an <img>, and in any rasteriser.
       When inlined into the DOM, restyle via the class hooks. -->
  <circle class="pxm-ring" cx="32" cy="32" r="26" fill="none"
          stroke="#c08418" stroke-width="2.5"/>
  <!-- hollow arrowhead: thick triangle with a notched base -->
  <path class="pxm-delta" fill="none" stroke="#f2c14b" stroke-width="6"
        stroke-linejoin="miter" stroke-linecap="butt"
        d="M32 13 L48.5 45 L15.5 45 Z"/>
  <!-- orbital band, crossing in front -->
  <ellipse class="pxm-orbit" cx="32" cy="32" rx="30" ry="10.5" fill="none"
           stroke="#4fa8e8" stroke-width="3" transform="rotate(-22 32 32)"/>
  <circle class="pxm-node" cx="53.4" cy="23.6" r="3.6" fill="#fad282"/>
</svg>
