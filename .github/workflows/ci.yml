name: CI

on:
  push:
    branches: [ dev, matrix-entry ]
  pull_request:
    branches: [ dev, matrix-entry ]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ♻️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --ignore-scripts

      - name: 🎨 Stylelint
        run: npm run lint:css:ci

      - name: 🔎 Typecheck
        run: npx tsc --noEmit

      - name: 🧪 Tests
        run: npm test

      - name: 🛠️ Build Frontend
        run: npm run build

  # The PARSEC Keycore's own tests: the vault suite (v1 and bankon-vault/2, the migration
  # fixture), the Keycore approval, and the command-surface exit tests. On every run.
  keycore-tests:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🦀 Install Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - name: 🐧 Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: 🔐 cargo test --lib
        working-directory: src-tauri
        # generate_context! needs frontendDist to exist; the tests do not use its contents.
        run: |
          mkdir -p ../dist && test -e ../dist/index.html || echo '<!doctype html>' > ../dist/index.html
          cargo test --lib --locked

  # Desktop build validation for pull requests into dev
  tauri-validation:
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ♻️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🦀 Install Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - name: 🐧 Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: 📦 Install dependencies
        run: npm ci --ignore-scripts

      - name: 🚀 Build Tauri (Pre-release validation)
        run: npm run tauri build 