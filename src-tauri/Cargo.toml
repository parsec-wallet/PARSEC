[package]
name = "parsec-wallet"
version = "0.1.0"
description = "Parsec Wallet — Algorand desktop wallet built on cypherpunk2048 principles"
authors = ["cypherpunk2048"]
edition = "2021"
license = "LicenseRef-BANKON"

[lib]
name = "parsec_wallet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri Core & Plugins
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async Runtime
tokio = { version = "1.0", features = ["full"] }

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# bankon_vault — Crypto
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
