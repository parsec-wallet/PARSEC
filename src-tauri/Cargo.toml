[package]
name = "parsec-wallet"
version = "0.1.0"
description = "Parsec Wallet — Algorand desktop wallet built on cypherpunk2048 principles"
authors = ["cypherpunk2048"]
edition = "2021"
license = "LicenseRef-BANKON"

[lib]
name = "parsec_wallet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri Core & Plugins
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async Runtime
tokio = { version = "1.0", features = ["full"] }

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# bankon_vault — Crypto
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"

# pmvpn — EVM Signing & SSH
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
hex = "0.4"

# parsec_search — PostgreSQL + pgvectorscale search engine
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "json"] }

# parsec_mesh — P2P mesh with IPFS handoffs
reqwest = { version = "0.12", features = ["json", "multipart"] }
axum = "0.7"
num_cpus = "1.16"

# parsec_sandbox — dApp filesystem access control (uses libc for statvfs)
libc = "0.2"

# parsec_validate — Algorand SHA-512/256 checksum + chain address validation
sha2 = "0.10"
