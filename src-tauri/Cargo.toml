[package]
name = "parsec-wallet"
version = "0.3.1"
description = "PARSEC Wallet — Algorand desktop wallet built on cypherpunk2048 principles"
authors = ["cypherpunk2048"]
edition = "2021"
rust-version = "1.99"
license = "GPL-3.0-or-later AND Apache-2.0"

[lib]
name = "parsec_wallet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri Core & Plugins
tauri = { version = "~2.10", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async Runtime
tokio = { version = "1.0", features = ["full"] }

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# bankon_vault — Crypto
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"

# pmvpn — EVM Signing & SSH
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
hex = "0.4"

# parsec_search — PostgreSQL + pgvectorscale search engine
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "json"] }

# parsec_mesh — P2P mesh with IPFS handoffs
# rustls, not the platform OpenSSL: one TLS stack on desktop and Android (no OpenSSL to cross-compile).
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "charset", "http2"] }
axum = { version = "0.7", features = ["ws"] }
num_cpus = "1.16"

# parsec_connect — dApp WebSocket bridge
tower-http = { version = "0.6", features = ["cors"] }

# parsec_sandbox — dApp filesystem access control (uses libc for statvfs)
libc = "0.2"

# parsec_validate — Algorand SHA-512/256 checksum + chain address validation
sha2 = "0.10"

# chain_algo / chain_sol — ed25519 keys and signatures (Algorand 25-word accounts,
# Solana SLIP-0010). Added deliberately: moving key generation for Algorand,
# Solana and Arweave out of the renderer and into Rust is what lets `algosdk`,
# `@solana/kit` and `node-forge` leave the frontend, which NARROWS the cp4096
# commitment-II gap described in docs/cypherpunk4096.md rather than widening it.
ed25519-dalek = { version = "2", features = ["rand_core"] }

# chain_ar — Arweave RSA-4096 JWK keys and RSA-PSS signatures
rsa = "0.9"

# chain_btc — Bitcoin chain pack (BIP-32/39/44/84 HD keys, P2WPKH/P2SH-P2WPKH/P2PKH)
bitcoin = { version = "0.32", features = ["rand-std"] }
bip39 = "2.1"
base64 = "0.22"

# network_monitor — read-only local interface enumeration + CPU/GPU snapshot
network-interface = "1"
sysinfo = "0.32"
russh = "0.54"
russh-keys = "0.49"
