# not "is it security-adjacent". Files that merely CALL a signer and are handed a signature back
# (arweave/{ant,ario,inject,module,turbo}.ts, namespaces/*, marketplace/escrow.ts, x402/*,
# aorc/*minter.ts, market-*.ts, name-mint.ts, pouch/*) stay Apache-2.0 under the default above.
# Verified against the source 2026-09-15; see LICENSE for the reasoning.
